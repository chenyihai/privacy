<h1>《XX单机游戏》隐私政策</h1>
<p>开发者：XXX（你的名字/个人开发标识）</p>
<p>联系邮箱：xxx@xxx.com</p>
<h2>1. 数据收集说明</h2>
<p>本游戏为纯单机，仅本地存储游戏进度，不会上传任何用户个人信息至网络；仅读取设备基础型号用于游戏适配，无追踪、无广告、无第三方SDK。</p>
<h2>2. 数据存储</h2>
<p>所有游戏存档仅保存在用户本机，开发者无法获取、读取任何本地数据。</p>
<h2>3. 用户权利</h2>
<p>用户可随时删除App清除全部本地存档数据；有疑问可发送邮件咨询。</p>
<p>生效日期：2026年XX月XX日</p>
